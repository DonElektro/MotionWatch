<!DOCTYPE html>
<!-- MoveEye: Startseite für «Heroine Dusk» in der Spielecke (Handy-tauglich). Das Spiel selbst liegt UNVERÄNDERT im Ordner
     spiel/ (= release/ von https://github.com/clintbellanger/heroine-dusk). Diese Seite lädt dieselben Skripte in derselben
     Reihenfolge wie spiel/index.html und ergänzt nur: Angabe «viewport», eine Leiste oben mit «‹ Spiele» und den Urhebern,
     Platz für diese Leiste (das Spiel rechnet mit einer um die Leiste niedrigeren Fensterhöhe), Berührungen als echte
     Berührungen (nicht «passiv»), damit ein Tipp nur einmal zählt. Lizenz dieser Seite: GPL v3 oder später (wie der Code
     des Spiels, Clint Bellanger); Änderung: MoveEye, 2026. Keine offizielle Quelle des Spiels - siehe LIZENZEN.txt. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#140c1c">
    <title>Heroine Dusk</title>
    <base href="spiel/">
    <link rel="icon" href="../thumb.png">
    <link rel="stylesheet" type="text/css" href="css/maze.css" />
    <style>
      html, body { overflow: hidden; height: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      #mw-back { display: none !important; }   /* MoveEye's floating «✕ Zurück»: this page has its own «‹ Spiele» (it clicks #mw-back) */
      #fs-bar { position: fixed; left: 0; right: 0; top: 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
        padding: 0 calc(8px + env(safe-area-inset-right, 0px)) 0 calc(8px + env(safe-area-inset-left, 0px)); background: #140c1c;
        color: #8595a1; font: 12px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif; z-index: 5; }
      #fs-bar a { color: #8595a1; }
      #fs-back { flex: none; display: inline-flex; align-items: center; min-height: 36px; min-width: 44px; box-sizing: border-box; padding: 6px 12px;
        border-radius: 10px; border: 1px solid #4e4a4e; background: #30346d; color: #deeed6 !important; font-weight: 600; font-size: 15px;
        text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
      #fs-cred { flex: 1 1 auto; min-width: 0; overflow: hidden; max-height: 32px; }
      #wrap { margin-top: 44px; }
    </style>
    <script>
      // MoveEye: the bar on top needs 44 px - the game sizes its canvas from window.innerHeight
      (function () {
        var BAR = 44, d = Object.getOwnPropertyDescriptor(window, "innerHeight");
        try {
          if (d && d.get) Object.defineProperty(window, "innerHeight", { configurable: true, get: function () { return Math.max(60, d.get.call(window) - BAR); } });
        } catch (e) {}
        // the game calls preventDefault() in its touch handlers on «window»: browsers only allow that for listeners that are not passive
        var add = window.addEventListener;
        window.addEventListener = function (t, f, o) {
          if (t === "touchstart" || t === "touchend") o = { capture: o === true || !!(o && o.capture), passive: false };
          return add.call(window, t, f, o);
        };
        function back(e) {
          if (e) { e.preventDefault(); e.stopPropagation(); }
          var b = document.querySelector("#mw-back a");
          if (b) b.click(); else if (history.length > 1) history.back();
        }
        document.addEventListener("DOMContentLoaded", function () {
          var a = document.getElementById("fs-back");
          a.addEventListener("click", back, true);
          a.addEventListener("touchend", back, true);            // a tap makes no click here (the game takes the touches)
          var l = document.getElementById("fs-liz");
          l.addEventListener("touchend", function () { window.open(l.href, "_blank"); }, true);
        });
      })();
    </script>
<!--SKRIPTE-->
  </head>
  <body onload="init()">
    <div id="fs-bar"><a id="fs-back" href="../">&#8249; Spiele</a>
      <div id="fs-cred">Heroine Dusk&trade; is created by Clint Bellanger &middot; music by Yubatake &middot; <a id="fs-liz" href="../LIZENZEN.txt" target="_blank">Lizenzen</a></div></div>
    <div id="wrap"><canvas id="gamecanvas" width="160" height="120"></canvas></div>
    <audio id="bgmusic" autoplay></audio>
  </body>
</html>
