# MoveEye Test-Runner (runner_einrichten.sh, moveeye-hp-update): Schutz und Grenzen. 4 GB RAM: höchstens etwa 3,4 GB für die Tests.
# Quelle: werkzeuge/test_runner/runner_dienst.conf -> /etc/systemd/system/<Runner-Dienst>.d/moveeye.conf
[Service]
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
# RestrictSUIDSGID und SystemCallFilter weggelassen: sperren openat2 (Ubuntu 26.04), dann kann tar nichts entpacken.
# NoNewPrivileges deckt SUID ab.
LockPersonality=yes
MemoryHigh=3G
MemoryMax=3400M
Nice=5
