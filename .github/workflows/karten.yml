# Offline-Karten (MoveEye, Teil 639zzq): baut die drei Dateien der Offline-Karte Schweiz mit werkzeuge/karten/paket.py –
#   karte-ch-N.pmtiles (Protomaps-Build des Tages, mit `pmtiles extract` auf schweiz.geojson zugeschnitten, z14 und z15 gemessen),
#   karte-web-N.zip (MapLibre, Stil, Schriften, Symbole, Lizenzen; reproduzierbar) und orte-ch-N.sqlite.gz (Ortssuche aus den
#   OpenStreetMap-Auszügen von Geofabrik) –, testet sie (werkzeuge/karten_test.py, auch mit den echten Dateien im Browser) und
#   legt sie auf Wunsch als Release an. Assets an «karten-N» (nie «latest»), Probe an «kartenprobe-<Lauf>».
#   Nur bauen + testen + messen:  gh api -X POST repos/DonElektro/MotionWatch/actions/workflows/karten.yml/dispatches -f ref=<zweig>
#   Probe-Release:                … -f 'inputs[release]=probe'
#   Echt:                         … -f ref=main -f 'inputs[release]=echt' -f 'inputs[tag]=karten-1'
#   Probe wegräumen:              … -f 'inputs[loeschen]=kartenprobe-N'
# Die Karte folgt OpenStreetMap vom Tag des Laufs: die Pins (Grösse + sha256) stehen danach in pins.txt (Release-Notiz und
# Hinweis im Lauf) und kommen mit `python3 werkzeuge/karten/paket.py --eintragen pins.txt` in quelle/639zzq. Ein Release wird nie
# überschrieben. Keine Geheimnisse: nur GITHUB_TOKEN.
name: Offline-Karten
on:
  workflow_dispatch:
    inputs:
      release:
        description: "keins · probe (Vorabversion kartenprobe-<Lauf>) · echt (Release <tag>, nur von main)"
        type: choice
        options: [keins, probe, echt]
        default: keins
      tag:
        description: "Tag für «echt» (karten-N, = TAG in werkzeuge/karten/paket.py und KQ_TAG in quelle/639zzq)"
        default: karten-1
      zoom:
        description: "höchste Zoomstufe der Karte: auto (z15, wenn unter 800 MB, sonst z14) · 14 · 15"
        type: choice
        options: [auto, "14", "15"]
        default: auto
      datum:
        description: "Protomaps-Build JJJJMMTT (leer = der neueste der letzten 15 Tage)"
        default: ""
      loeschen:
        description: "Statt bauen: Probe-Release + Tag löschen (nur kartenprobe-N, nur Vorabversion)"
        default: ""
permissions:
  contents: write
concurrency:
  group: karten
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  REL: ${{ inputs.release || 'keins' }}

jobs:
  bauen:
    name: Offline-Karten · ${{ inputs.release || 'keins' }}
    if: github.repository == 'DonElektro/MotionWatch' && inputs.loeschen == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prüfen (Tag, Zweig, Release noch nicht da)
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'karten-1' }}
        run: |
          set -e
          sha=$(git rev-parse HEAD)
          ptag=$(sed -n 's/^TAG = "\(karten-[0-9]*\)"$/\1/p' werkzeuge/karten/paket.py)
          qtag=$(sed -n 's/^KQ_TAG = "\(karten-[0-9]*\)"$/\1/p' quelle/639zzq_offline_karten.py)
          [ -n "$ptag" ] && [ "$ptag" = "$qtag" ] || { echo "::error::TAG in paket.py ($ptag) und KQ_TAG in quelle/639zzq ($qtag) passen nicht"; exit 1; }
          if [ "$REL" = "echt" ]; then
            [ "$TAG" = "$ptag" ] || { echo "::error::Tag $TAG ist nicht $ptag (paket.py)"; exit 1; }
            msha=$(git ls-remote origin refs/heads/main | cut -f1)
            [ "$GITHUB_REF_NAME" = "main" ] && [ "$sha" = "$msha" ] || { echo "::error::echt nur vom aktuellen main ($msha), nicht $GITHUB_REF_NAME ($sha)"; exit 1; }
            tag="$TAG"
          else
            tag="kartenprobe-$GITHUB_RUN_NUMBER"
          fi
          if [ "$REL" != "keins" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag gibt es schon - nie überschreiben"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Werkzeuge (pmtiles, osmium, shapely)
        run: |
          set -e
          go install github.com/protomaps/go-pmtiles@v1.31.2
          ln -sf "$(go env GOPATH)/bin/go-pmtiles" "$RUNNER_TEMP/pmtiles"
          "$RUNNER_TEMP/pmtiles" version || true
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          pip install -q osmium==4.3.1 shapely==2.1.2
      - name: Karte zuschneiden (Protomaps-Build, z15 und z14 messen)
        run: |
          set -e
          python3 -I werkzeuge/karten/paket.py --kacheln --aus "$RUNNER_TEMP/out" --pmtiles "$RUNNER_TEMP/pmtiles" \
            --zoom "${{ inputs.zoom || 'auto' }}" ${{ inputs.datum != '' && format('--datum {0}', inputs.datum) || '' }}
          ls -la "$RUNNER_TEMP/out"
          rm -f "$RUNNER_TEMP"/out/ch-z1[45].pmtiles
      - name: Web-Paket (MapLibre, Stil, Schriften, Symbole, Lizenzen)
        run: python3 -I werkzeuge/karten/paket.py --web --aus "$RUNNER_TEMP/out"
      - name: Ortssuche aus OpenStreetMap (Geofabrik Schweiz + Liechtenstein)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/osm" && cd "$RUNNER_TEMP/osm"
          for a in switzerland liechtenstein; do
            curl -sSfL -o "$a.osm.pbf" "https://download.geofabrik.de/europe/$a-latest.osm.pbf"
            curl -sSfL -o "$a.md5" "https://download.geofabrik.de/europe/$a-latest.osm.pbf.md5"
            echo "$(cut -d' ' -f1 "$a.md5")  $a.osm.pbf" | md5sum -c -
            osmium tags-filter "$a.osm.pbf" n/place n/natural=peak,saddle,volcano n/mountain_pass=yes wr/natural=water,glacier \
              wr/place=island,islet w/highway=residential,living_street,pedestrian,unclassified,tertiary,secondary,primary,trunk,road \
              r/boundary=administrative -o "$a.f.osm.pbf" --overwrite
            ls -la "$a.osm.pbf" "$a.f.osm.pbf"
          done
          cd "$GITHUB_WORKSPACE"
          python3 -I werkzeuge/karten/paket.py --orte --aus "$RUNNER_TEMP/out" --pbf "$RUNNER_TEMP/osm/switzerland.f.osm.pbf" --pbf "$RUNNER_TEMP/osm/liechtenstein.f.osm.pbf"
      - name: Pins (pins.txt)
        run: |
          set -e
          python3 -I werkzeuge/karten/paket.py --pins --aus "$RUNNER_TEMP/out"
          while read -r l; do echo "::notice title=Offline-Karten::$l"; done < "$RUNNER_TEMP/out/pins.txt"
          echo "::notice title=Offline-Karten Messung::$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("z15=%.1f MB z14=%.1f MB gewaehlt=z%d datum=%s" % (d["z15"]/1e6, d["z14"]/1e6, d["wahl"], d["datum"]))' "$RUNNER_TEMP/out/kacheln.json")"
          echo "::notice title=Offline-Karten Orte::$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("anzahl=%d sqlite=%.1f MB arten=%s" % (d["anzahl"], d["sqlite"]/1e6, json.dumps(d["arten"], sort_keys=True)))' "$RUNNER_TEMP/out/orte.json")"
      - name: MoveEye bauen und die Karte testen (karten_test.py, auch mit den echten Dateien im Browser)
        run: |
          set -e
          pip install -q opencv-python-headless numpy flask pillow cryptography playwright==1.49.1
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 werkzeuge/bauen.py | tail -2
          mkdir -p "$RUNNER_TEMP/bilder"
          python3 -W ignore werkzeuge/karten_test.py --web "$RUNNER_TEMP/out/karte-web-1.zip"
          python3 -W ignore werkzeuge/karten_test.py --echt "$RUNNER_TEMP/out" --bilder "$RUNNER_TEMP/bilder"
      - name: Bilder, Pins und Messung als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karten-test-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/bilder
            ${{ runner.temp }}/out/pins.txt
            ${{ runner.temp }}/out/kacheln.json
            ${{ runner.temp }}/out/orte.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Zusammenfassung
        if: always()
        run: |
          { echo "### Offline-Karten"; echo '```'; cat "$RUNNER_TEMP/out/pins.txt" 2>/dev/null; cat "$RUNNER_TEMP/out/kacheln.json" 2>/dev/null; cat "$RUNNER_TEMP/out/orte.json" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Release anlegen, Assets hochladen, zurücklesen
        if: env.REL == 'probe' || env.REL == 'echt'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -e
          O="$RUNNER_TEMP/out"
          unzip -p "$O/karte-web-1.zip" LIZENZEN.txt > "$O/LIZENZEN.txt"
          {
            if [ "$REL" = "probe" ]; then echo "PROBELAUF (Vorabversion) - nicht für Geräte, wird wieder gelöscht."; echo; fi
            echo "Offline-Karte Schweiz für MoveEye (Teil 639zzq): Vektorkarte (PMTiles), Web-Paket (MapLibre, Stil, Schriften) und Ortssuche."
            echo "© OpenStreetMap-Mitwirkende (ODbL). Quellen und Lizenzen: LIZENZEN.txt; gebaut mit"
            echo "https://github.com/$GITHUB_REPOSITORY/blob/$SHA/werkzeuge/karten/paket.py"
            echo
            sed 's/^PIN /pin: /; s/^INFO /info: /' "$O/pins.txt"
            echo "commit: $SHA"
            echo "lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md
          A="$O/karte-ch-1.pmtiles $O/karte-web-1.zip $O/orte-ch-1.sqlite.gz $O/pins.txt $O/LIZENZEN.txt"
          for i in 1 2 3; do
            if [ "$REL" = "probe" ]; then
              gh release create "$TAG" $A -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Probe · Offline-Karten" --notes-file notes.md --prerelease --latest=false && break
            else
              gh release create "$TAG" $A -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Offline-Karte Schweiz" --notes-file notes.md --latest=false && break
            fi
            echo "Versuch $i fehlgeschlagen, warte"; sleep 30
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "::error::Release halb angelegt - bitte von Hand prüfen"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/zurueck"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'karte-*' -p 'orte-*' -D "$RUNNER_TEMP/zurueck"
          for f in "$RUNNER_TEMP"/zurueck/*; do
            s=$(grep " name=$(basename "$f") " "$O/pins.txt" | sed 's/.*sha256=\([0-9a-f]*\).*/\1/'); echo "$s  $f" | sha256sum -c -
          done
          echo "latest bleibt: $(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"

  weg:
    name: Probe löschen · ${{ inputs.loeschen }}
    if: github.repository == 'DonElektro/MotionWatch' && inputs.loeschen != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe-Release und Tag löschen (nur kartenprobe-N, nur Vorabversion, nie «latest»)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.loeschen }}
        run: |
          set -e
          echo "$TAG" | grep -Eq '^kartenprobe-[0-9]+$' || { echo "::error::nur kartenprobe-N, nicht $TAG"; exit 1; }
          pre=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)
          [ "$pre" = "true" ] || { echo "::error::$TAG ist keine Vorabversion - nicht gelöscht"; exit 1; }
          [ "$TAG" != "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" ] || { echo "::error::$TAG ist latest"; exit 1; }
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "gelöscht: $TAG" >> "$GITHUB_STEP_SUMMARY"
