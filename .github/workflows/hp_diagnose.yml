# Kurze Prüfung des HP-Test-Runners aus der Ferne (nur Shell-Befehle, keine Actions).
# Start: gh api -X POST repos/DonElektro/MotionWatch/actions/workflows/hp_diagnose.yml/dispatches -f ref=main
# Gibt keine Namen, Adressen oder Zugangsdaten aus (Bluetooth-Adressen werden unkenntlich gemacht; Gerätenamen von USB- und
# Eingabegeräten sind Typenbezeichnungen der Hardware, keine Benutzerdaten). Das Testbild am HP zeigt danach keine Zusammenfassung (job_start.sh).
name: HP-Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, moveeye-hp]
    timeout-minutes: 5
    steps:
      - name: Prüfen
        shell: bash
        run: |
          set +e
          echo "== System"; uname -r; grep -E '^(VERSION_ID|VERSION_CODENAME)=' /etc/os-release
          echo "== Prozess"; grep -E 'NoNewPrivs|Seccomp' /proc/self/status
          echo "== Arbeitsordner"; pwd; findmnt -T "$PWD" -o TARGET,FSTYPE,OPTIONS; df -h "$PWD" | tail -1
          ls -ld "$PWD" "$RUNNER_TEMP" "$(dirname "$RUNNER_TOOL_CACHE")" 2>&1
          echo "== Schreibtest"
          T="$RUNNER_TEMP/probe_$$"; mkdir "$T" && echo "mkdir OK" || echo "mkdir FEHLER"
          echo hallo > "$T/a.txt" && echo "Datei OK" || echo "Datei FEHLER"
          python3 -c "import os;os.makedirs('$T/py/x');print('python mkdir OK')" 2>&1
          (cd "$T" && mkdir -p q/r && echo x > q/r/b && tar -czf t.tgz q && mkdir aus && tar -xzf t.tgz -C aus && echo "tar OK") 2>&1 | tail -3
          tar --version | head -1
          python3 -c "import ctypes,os;l=ctypes.CDLL(None,use_errno=True);r=l.syscall(437,-100,b'/tmp',b'\\0'*24,24);print('openat2:',r,os.strerror(ctypes.get_errno()) if r<0 else 'OK')"
          W="$(dirname "$RUNNER_TEMP")/_actions"; echo "_actions: $W"; ls -ld "$W" 2>&1
          mkdir -p "$W/probe_$$" && echo "_actions mkdir OK" || echo "_actions mkdir FEHLER"; rmdir "$W/probe_$$" 2>/dev/null
          rm -rf "$T"
          echo "== Bildschirm"
          ls /tmp/.X11-unix/ 2>&1; cat /etc/moveeye-kiosk-test.conf 2>&1 | grep -v -i pass
          for d in :0 :1; do DISPLAY=$d timeout 5 python3 -c "import ctypes,sys;x=ctypes.CDLL('libX11.so.6');x.XOpenDisplay.restype=ctypes.c_void_p;print(sys.argv[1],'Bildschirm OK' if x.XOpenDisplay(None) else 'kein Zugriff')" $d 2>&1; done
          python3 -c "import tkinter;print('tkinter da')" 2>&1 | tail -1
          ls -d "$MW_RUNNER_HOME"/venv 2>&1; "$MW_RUNNER_PY" -c "import sys;print(sys.version)" 2>&1
          echo "== HP-Update / Testbild"
          ls -l /usr/local/sbin/moveeye-hp-update /usr/local/lib/moveeye-kiosk/ 2>&1 | cut -c1-160
          systemctl list-timers --all --no-legend 'moveeye-hp-update*' 2>&1 | head -3
          systemctl show moveeye-hp-update.service -p ActiveState -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp 2>&1
          echo "Zustand HP-Update:"; for f in version sim_version fassung letzter_lauf wartet nichts_neu verschoben; do
            p="/var/lib/moveeye-hp-update/$f"; [ -e "$p" ] && echo "  $f: $(head -c 80 "$p" | tr -cd '0-9a-zA-Z. \n' | head -n 1) ($(date -r "$p" '+%F %T'))" || echo "  $f: -"; done
          grep -m1 '^HP_FASSUNG=' /usr/local/sbin/moveeye-hp-update 2>&1 | cut -c1-60
          journalctl -u moveeye-hp-update.service -n 8 --no-pager -o short-iso 2>&1 | cut -c1-200
          ls -l /var/log/moveeye-hp-update.log 2>&1; tail -n 25 /var/log/moveeye-hp-update.log 2>&1 | cut -c1-200
          python3 -c "import tkinter;print('tkinter da', tkinter.TkVersion)" 2>&1 | tail -1
          ls -la /run/moveeye-test/ /run/moveeye-spiel/ 2>&1
          echo "HP-Update zuletzt geprüft vor $(( ($(date +%s) - $(cat /var/lib/moveeye-hp-update/letzter_lauf 2>/dev/null || echo 0)) / 60 )) Min."
          ls -la "$MW_RUNNER_HOME"/dauer/ 2>&1 | head -5
          ps -eo user,etime,args | grep -E 'testbild|hp_wache|kiosk_sitzung|MoveEyeSim|Xorg|openbox' | grep -v grep | cut -c1-160
          echo "== Bluetooth / Controller (ohne Adressen)"
          if compgen -G '/sys/class/bluetooth/hci*' >/dev/null; then A=ja; else A=nein; fi
          C=nein
          for d in /sys/bus/hid/devices/*:054C:0CE6.* /sys/bus/hid/devices/*:054C:0DF2.*; do
            [ -e "$d" ] || continue
            case "$(basename "$d")" in 0005:*) C="ja (Bluetooth)" ;; 0003:*) C="ja (USB-C)" ;; *) C=ja ;; esac
          done
          echo "Bluetooth: Adapter $A, Controller verbunden $C"
          V="$(dpkg-query -W -f='${db:Status-Abbrev}${Version}' bluez 2>/dev/null)"
          case "$V" in ii*) echo "bluez ${V#ii }" ;; *) echo "bluez fehlt" ;; esac
          echo "bluetooth.service: $(systemctl is-active bluetooth.service 2>/dev/null | head -n 1)"
          modinfo -F filename hid_playstation >/dev/null 2>&1 && echo "Treiber hid-playstation: da" || echo "Treiber hid-playstation: fehlt"
          echo "Koppeln (moveeye-controller-koppeln.path): $(systemctl is-enabled moveeye-controller-koppeln.path 2>/dev/null | head -n 1) / $(systemctl is-active moveeye-controller-koppeln.path 2>/dev/null | head -n 1)"
          python3 -I -c "import json;d=json.load(open('/run/moveeye-controller/status.json'));print('Letztes Koppeln:',str(d.get('schritt'))[:20],'-',str(d.get('text'))[:120])" 2>/dev/null || echo "Letztes Koppeln: -"
          echo "Joystick-Geräte (js*): $(compgen -G '/dev/input/js*' | wc -l)"
          echo "== Bluetooth-Hardware (HP_FASSUNG 7; Adressen unkenntlich, nur lesen)"
          export PATH="$PATH:/usr/sbin:/sbin"            # modinfo, rfkill, lspci, hciconfig liegen oft in sbin
          ohne() { sed -E 's/([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}/XX:XX:XX:XX:XX:XX/g' | cut -c1-200; }
          echo "Kern: $(uname -r)"
          echo "-- rfkill list"; if command -v rfkill >/dev/null; then rfkill list 2>&1 | ohne; [ -n "$(rfkill list 2>/dev/null)" ] || echo "(leer: kein Funk-Gerät)"; else echo "rfkill fehlt"; fi
          echo "-- lsusb"; if command -v lsusb >/dev/null; then lsusb 2>&1 | ohne; else echo "lsusb fehlt (usbutils)"; for d in /sys/bus/usb/devices/*/idVendor; do [ -r "$d" ] && echo "  $(cat "$d"):$(cat "${d%idVendor}idProduct") $(cat "${d%idVendor}product" 2>/dev/null | cut -c1-60)"; done; fi
          B=0; for d in /sys/bus/usb/devices/*; do
            [ "$(cat "$d/bDeviceClass" 2>/dev/null)$(cat "$d/bDeviceSubClass" 2>/dev/null)$(cat "$d/bDeviceProtocol" 2>/dev/null)" = e00101 ] && B=$((B + 1))
            [ "$(cat "$d/bInterfaceClass" 2>/dev/null)$(cat "$d/bInterfaceSubClass" 2>/dev/null)$(cat "$d/bInterfaceProtocol" 2>/dev/null)" = e00101 ] && B=$((B + 1))
          done; echo "USB-Geräte mit Bluetooth-Kennung (Klasse e0/01/01): $B"
          echo "-- lspci (Funk)"; if command -v lspci >/dev/null; then lspci -nn 2>&1 | grep -i -E "blue|network|wireless" | ohne; lspci -nn 2>/dev/null | grep -qi -E "blue|network|wireless" || echo "(keine Funk-Karte am PCI)"; else echo "lspci fehlt (pciutils)"; fi
          echo "-- hciconfig -a"; if command -v hciconfig >/dev/null; then hciconfig -a 2>&1 | ohne | head -n 30; else echo "hciconfig fehlt (seit BlueZ 5.5x nicht mehr dabei)"; fi
          echo "-- bluetoothctl show"; if command -v bluetoothctl >/dev/null; then timeout 8 bluetoothctl show 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v -i -E "^\s*(Name|Alias):" | ohne | head -n 30; else echo "bluetoothctl fehlt"; fi
          echo "-- dmesg (Bluetooth, letzte Zeilen)"; M="$(dmesg 2>&1 | grep -i -E "blue|btusb|hci" | tail -n 25 | ohne)"; if [ -n "$M" ]; then echo "$M"; else echo "(nichts oder dmesg für diesen Benutzer gesperrt: kernel.dmesg_restrict=$(cat /proc/sys/kernel/dmesg_restrict 2>/dev/null))"; fi
          echo "-- Module geladen"; for m in bluetooth btusb btintel btrtl hidp uhid hid_playstation hid_sony xpad hid_microsoft; do if [ -d "/sys/module/$m" ]; then echo "  $m: geladen"; else echo "  $m: -"; fi; done
          echo "-- Treiber vorhanden (Kern $(uname -r))"
          for m in hid_playstation btusb hidp xpad; do
            f="$(modinfo -F filename "$m" 2>/dev/null | head -n 1)"
            [ -n "$f" ] || f="$(find "/lib/modules/$(uname -r)" -name "${m//_/[-_]}.ko*" 2>/dev/null | head -n 1)"
            [ -n "$f" ] || { grep -q -E "/${m//_/[-_]}\.ko" "/lib/modules/$(uname -r)/modules.builtin" 2>/dev/null && f="(fest im Kern)"; }
            echo "  $m: ${f:-fehlt}" | sed "s#/lib/modules/$(uname -r)/##"
          done
          command -v modinfo >/dev/null || echo "  (modinfo nicht im Pfad dieses Benutzers)"
          dpkg-query -W -f='  ${Package} ${db:Status-Abbrev}${Version}\n' bluez "linux-modules-extra-$(uname -r)" usbutils pciutils 2>&1 | cut -c1-120
          grep -E "Treiber|hid-playstation|Bluetooth|Controller" /var/log/moveeye-hp-update.log 2>/dev/null | tail -n 6 | cut -c1-200
          for f in /etc/udev/rules.d/*moveeye* /etc/bluetooth/main.conf.d/*moveeye*; do [ -e "$f" ] && echo "  da: $f"; done
          echo "-- Eingabegeräte (nur Namen)"; grep '^N: Name=' /proc/bus/input/devices 2>&1 | cut -c1-100
          echo "== Dienst-Schutz"
          U="$(systemctl list-units --type=service --no-legend 'actions.runner.*' | awk '{print $1}' | head -1)"
          systemctl show "$U" -p ProtectSystem -p ProtectHome -p SystemCallFilter -p SystemCallErrorNumber -p RestrictFileSystems -p ReadOnlyPaths -p ReadWritePaths -p PrivateTmp -p RestrictNamespaces 2>&1 | cut -c1-200
          ls /etc/systemd/system/"$U".d/ 2>&1
