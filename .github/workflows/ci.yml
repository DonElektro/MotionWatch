# CI: die schweren Prüfungen auf GitHub statt auf dem lokalen Rechner (Nov. 2026). Lokal abfragen / warten:
#   werkzeuge/ci_status.sh [zweig|commit] [--warten] [--fehler]
#  - Push auf real-*: nur was die Änderung betrifft (Job «Auswahl», Regeln in werkzeuge/ci_auswahl.py), ohne Export
#  - Push auf integration: dasselbe gegenüber main, dazu der Export; ist derselbe Commit schon auf main, nur die Grundprüfungen
#  - Push auf main: IMMER ALLES, dazu Export Linux + Windows + Pi (ohne Signatur) als Artefakt
#  - von Hand (Actions -> CI -> Run workflow): alles (Haken «alles» weg: nur was die Änderung betrifft), Export abwählbar;
#    «[export]» in der Commit-Nachricht: Export auch auf real-*
# Aufbau: Auswahl -> parallel [MoveEye · Grundprüfungen | MoveEye · Web · <Gruppe> | Simulator … | HP-Update | USB-Installer | Pi-Dienst | Export]
#         -> Ergebnis (Torwächter: rot, wenn etwas rot ist oder fehlt; auf main auch, wenn irgendetwas übersprungen wurde).
# NEUER TEST: eine Zeile in werkzeuge/ci_tests.txt (Gruppe | Limit | Nochmal | Befehl | Name) - diese Datei hier bleibt wie sie ist.
#   Godot-Tests (werkzeuge/*_test.gd) kommen von selbst dazu (Job «Simulator · Testliste»).
# Keine Geheimnisse: der Signierschlüssel kommt nie hierher (Signieren bleibt lokal), keine ntfy-Themen.
name: CI
on:
  push:
    branches: ["real-*", integration, main]
  workflow_dispatch:
    inputs:
      alles:
        description: "alles prüfen (auch die Spiele-Tests), egal was geändert wurde"
        type: boolean
        default: true
      export:
        description: "Simulator exportieren (Linux + Windows, ohne Signatur)"
        type: boolean
        default: true
      probe:
        description: "Probe (nie auf main): so tun, als wären nur diese Dateien geändert – z. B. quelle/560_uebersetzungen_de.py"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  # (a probe run by hand never cancels another run and is never cancelled)
  group: ci-${{ github.ref }}${{ github.event.inputs.probe && format('-probe-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/real-') }}
env:
  GODOT_VER: "4.3"
  GODOT_BIN: /home/runner/godot/Godot_v4.3-stable_linux.x86_64
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------- Auswahl: was muss für diesen Stand laufen?
  auswahl:
    name: Auswahl · was läuft, was wird übersprungen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read                     # is the same commit already running on main?
    outputs:
      web: ${{ steps.a.outputs.web }}
      gruppen: ${{ steps.a.outputs.gruppen }}
      sim: ${{ steps.a.outputs.sim }}
      hp: ${{ steps.a.outputs.hp }}
      usb: ${{ steps.a.outputs.usb }}
      pidienst: ${{ steps.a.outputs.pidienst }}
      laeuft: ${{ steps.a.outputs.laeuft }}
      grund: ${{ steps.a.outputs.grund }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge
      - name: Regeln der Auswahl (Selbsttest)
        run: python3 werkzeuge/ci_auswahl.py --selbsttest
      - id: a
        name: Auswahl (geänderte Dateien gegenüber main)
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALLES: ${{ github.event.inputs.alles }}
          CI_PROBE: ${{ github.event.inputs.probe }}
        run: python3 werkzeuge/ci_auswahl.py --auswahl

  # ---------------------------------------------------------------- MoveEye
  moveeye:
    name: MoveEye · Grundprüfungen (bauen --pruefen, Selbsttest, Update)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: werkzeuge/ci_pakete.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pakete
        run: pip install -q opencv-python-headless numpy flask pillow cryptography
      - name: Testliste vollständig (jede werkzeuge/*_test.py steht in werkzeuge/ci_tests.txt)
        run: python3 werkzeuge/ci_lauf.py --pruefen
      - name: Grundprüfungen (Gruppe «basis» aus werkzeuge/ci_tests.txt – Zeit je Test in der Zusammenfassung)
        run: python3 werkzeuge/ci_lauf.py --gruppe basis

  # Die Web-Tests in parallelen Gruppen. Welche Gruppen laufen, bestimmt der Job «Auswahl»; die Tests jeder Gruppe stehen
  # in werkzeuge/ci_tests.txt. Die Spiele-Gruppen (spiele-1, spiele-2) laufen nur bei Spiele-Änderungen - auf main immer.
  web:
    name: MoveEye · Web · ${{ matrix.gruppe }}
    needs: auswahl
    # (!cancelled: also runs when the selection itself broke - then with every group)
    if: ${{ !cancelled() && needs.auswahl.outputs.web != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gruppe: ${{ fromJSON(needs.auswahl.outputs.gruppen || '["kern","rechte","live","daten","spiele-1","spiele-2"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: werkzeuge/ci_pakete.txt
      - name: Pakete
        run: pip install -q -r werkzeuge/ci_pakete.txt
      - name: Chromium (Cache)
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.55.0-chromium
      - name: Chromium installieren
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then python3 -m playwright install-deps chromium
          else python3 -m playwright install --with-deps chromium; fi
      - name: Tests der Gruppe «${{ matrix.gruppe }}» (werkzeuge/ci_tests.txt – Zeit je Test in der Zusammenfassung)
        env:
          GRUPPE: ${{ matrix.gruppe }}
        run: python3 werkzeuge/ci_lauf.py --gruppe "$GRUPPE"

  # ---------------------------------------------------------------- Simulator
  sim-texte:
    name: Simulator · sim_texte.py --pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            simulator3d
            werkzeuge
      - run: python3 werkzeuge/sim_texte.py --pruefen

  # ---------------------------------------------------------------- USB-Installer (Simulator-PC neu aufsetzen)
  usb-installer:
    name: USB-Installer · ${{ matrix.pruefung }}
    needs: auswahl
    if: ${{ !cancelled() && needs.auswahl.outputs.usb != 'false' }}     # only when werkzeuge/usb_installer/ changed; on main always
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pruefung: ["statisch", "pakete ubuntu:24.04", "pakete ubuntu:26.04", "retten ubuntu:24.04", "retten ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge/usb_installer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pakete
        run: pip install -q pyyaml jsonschema
      - name: pruefen.sh ${{ matrix.pruefung }}
        env:
          P: ${{ matrix.pruefung }}
        run: bash werkzeuge/usb_installer/pruefen.sh $P

  # ---------------------------------------------------------------- Pi-Dienst: MoveEye unter echtem systemd wie auf dem Pi
  # GitHubs Ubuntu-Runner ist eine VM mit systemd als PID 1: «loginctl enable-linger» gibt einem Test-Benutzer seinen eigenen
  # systemd --user (wie der Benutzer auf dem Pi), sudo ist ohne Passwort. Python 3.11 und die Paket-Versionen von Bookworm.
  # Läuft nur auf GitHubs Runnern (nie auf dem HP: der rechnet anderes). Tests: Gruppe «pidienst» in werkzeuge/ci_tests.txt.
  pi-dienst:
    name: Pi-Dienst · echtes systemd (Benutzer- und System-Dienst), Bookworm-Pakete
    needs: auswahl
    if: ${{ !cancelled() && needs.auswahl.outputs.pidienst != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: werkzeuge/pakete_bookworm.txt
      - name: Pakete wie auf Raspberry Pi OS Bookworm (werkzeuge/pakete_bookworm.txt)
        run: pip install -q -r werkzeuge/pakete_bookworm.txt
      - name: systemd auf dem Runner
        run: |
          ps -o pid,comm -p 1; systemctl --version | head -1; systemctl is-system-running || true
          # the test user runs this Python (tool cache of setup-python): readable for everybody
          ls -ld /opt/hostedtoolcache /opt/hostedtoolcache/Python; command -v python3
      - name: Tests der Gruppe «pidienst» (werkzeuge/ci_tests.txt)
        run: python3 werkzeuge/ci_lauf.py --gruppe pidienst
      - name: Journal aufbewahren
        if: failure()
        run: sudo journalctl --no-pager -o short-precise --since "-40 min" > "$RUNNER_TEMP/journal.log" 2>&1 || true
      - name: Protokoll aufbewahren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-pi-dienst
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  # ---------------------------------------------------------------- Simulator-PC (HP): signiertes Update, Haken, Testbild
  hp-update:
    name: HP-Update · Prüfkette + Einspielen
    needs: auswahl
    if: ${{ !cancelled() && needs.auswahl.outputs.hp != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x hp werkzeuge/test_runner/*.sh werkzeuge/linux_paket.sh
          shellcheck -x simulator3d/beilagen_linux/kiosk_sitzung.sh simulator3d/beilagen_linux/kiosk_ein.sh simulator3d/beilagen_linux/kiosk_aus.sh simulator3d/beilagen_linux/controller_koppeln.sh
      - name: Testbild (Python)
        run: python3 -m py_compile simulator3d/beilagen_linux/testbild.py simulator3d/beilagen_linux/hp_wache.py simulator3d/beilagen_linux/controller_fenster.py werkzeuge/erkennungstest/fortschritt.py werkzeuge/erkennungstest/erkennungstest.py werkzeuge/test_runner/dauer.py
      - name: dauer_test.sh (Dauerrechnen - Spielen hält an, sichert, rechnet weiter)
        run: bash werkzeuge/test_runner/dauer_test.sh
      - name: controller_test.sh (PS5-Controller koppeln mit Ersatz-bluetoothctl)
        run: bash werkzeuge/test_runner/controller_test.sh
      - name: hp_update_test.sh (echte Signaturen, Verfälschungen, Einspielen mit Test-Schlüssel)
        run: sudo bash werkzeuge/test_runner/hp_update_test.sh

  sim-liste:
    name: Simulator · Testliste
    needs: auswahl
    if: ${{ !cancelled() && needs.auswahl.outputs.sim != 'false' }}     # skipped -> the jobs «Simulator · <test>» are skipped with it
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.l.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge
      - id: l
        run: |
          t=$(cd werkzeuge && ls *_test.gd | sed 's/\.gd$//' | python3 -c 'import json,sys; print(json.dumps(["parse"]+sys.stdin.read().split()))')
          echo "tests=$t" >> "$GITHUB_OUTPUT"; echo "$t"

  sim:
    name: Simulator · ${{ matrix.test }}
    needs: sim-liste
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.sim-liste.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: |
          export HOME="/tmp/ci_home_import"; mkdir -p "$HOME"
          timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/import.log"
      - name: Test ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
        run: |
          export HOME="/tmp/ci_home_$TEST"; mkdir -p "$HOME"       # own test HOME under /tmp (hospiz_test insists), never a real one
          log="$RUNNER_TEMP/$TEST.log"
          cd simulator3d
          if [ "$TEST" = "parse" ]; then
            # main scene without picture: every script must load, schnittstelle.gd writes «Schnittstelle: OK …» after 2 s
            ( timeout 180 "$GODOT_BIN" --headless --path . -- --no-update --no-tour --port 9447 > "$log" 2>&1 ) &
            pid=$!
            for i in $(seq 1 170); do
              grep -qE "Schnittstelle: OK|SCRIPT ERROR" "$log" 2>/dev/null && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            pkill -f "Godot_v4.3-stable_linux.x86_64 --headless --path . --" || true
            wait $pid || true
            grep -E "Schnittstelle|SCRIPT ERROR|Parse Error|Failed to load script" "$log" | head -40
            if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" "$log"; then echo "::error::Skript-Fehler (siehe oben)"; exit 1; fi
            grep -q "Schnittstelle: OK" "$log" || { tail -60 "$log"; echo "::error::kein «Schnittstelle: OK»"; exit 1; }
            echo "Parse-Check OK"
          else
            # up to 3 attempts (Godot tests are sometimes flaky on the runner, e.g. gelenke_test at 3.29.0); green = exit 0 and no SCRIPT ERROR
            ok=0
            for try in 1 2 3; do
              rm -rf "$HOME"; mkdir -p "$HOME"
              set +e
              timeout 900 "$GODOT_BIN" --headless --path . -s "$PWD/../werkzeuge/$TEST.gd" -- --no-update --no-tour > "$log" 2>&1
              rc=$?
              set -e
              if [ $rc -eq 0 ] && ! grep -q "SCRIPT ERROR" "$log"; then ok=1; break; fi
              echo "::warning::$TEST: Versuch $try fehlgeschlagen (Exit-Code $rc)"
              # was der Test selbst meldet (die letzten 40 Zeilen sind beim Beenden oft nur Meldungen von Godot)
              grep -aE "FEHLER|SCRIPT ERROR" "$log" | head -40 || true
              tail -40 "$log"
            done
            tail -40 "$log"
            [ $ok -eq 1 ] || { echo "::error::$TEST: 3 Versuche fehlgeschlagen (Exit-Code $rc)"; exit 1; }
            [ $try -eq 1 ] || echo "::warning::$TEST: erst im Versuch $try grün"
          fi
      - name: Protokoll aufbewahren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.test }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  # ---------------------------------------------------------------- Tests gegen einen laufenden Simulator (ohne Bild)
  sim-live:
    name: Simulator · läuft (SmallTV, Hospiz live)
    needs: auswahl
    if: ${{ !cancelled() && needs.auswahl.outputs.sim != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIM: http://127.0.0.1:9461
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: werkzeuge/ci_pakete.txt
      - name: Pakete
        run: pip install -q opencv-python-headless numpy flask pillow cryptography
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: |
          export HOME="/tmp/ci_home_import"; mkdir -p "$HOME"
          timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/import.log"
      - name: Simulator starten (ohne Bild, sendet auf Port 9461, eigenes Test-HOME)
        run: |
          export HOME="/tmp/ci_home_simlive"; rm -rf "$HOME"; mkdir -p "$HOME"     # own test HOME (hospiz_test.py sets a test password there)
          cd simulator3d
          nohup "$GODOT_BIN" --headless --path . -- --no-update --no-tour --stream --port 9461 > "$RUNNER_TEMP/simlive.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/simlive.pid"
          for i in $(seq 1 180); do
            curl -fsS -m 3 "$SIM/v.json" > /dev/null 2>&1 && break
            kill -0 "$(cat "$RUNNER_TEMP/simlive.pid")" 2>/dev/null || break
            sleep 1
          done
          curl -fsS -m 5 "$SIM/v.json" || { tail -60 "$RUNNER_TEMP/simlive.log"; echo "::error::der Simulator antwortet nicht auf $SIM"; exit 1; }
          if grep -qE "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/simlive.log"; then grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/simlive.log" | head -20; echo "::error::Skript-Fehler beim Start"; exit 1; fi
      - name: Tests gegen den laufenden Simulator (Gruppe «simlive» aus werkzeuge/ci_tests.txt)
        env:
          SIM_HOSPIZ: /tmp/ci_home_simlive/.local/share/godot/app_userdata/MoveEye Sim 3D/bergtal_horror.json
        run: python3 werkzeuge/ci_lauf.py --gruppe simlive
      - name: Simulator beenden
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/simlive.pid" 2>/dev/null)" 2>/dev/null || true
          tail -15 "$RUNNER_TEMP/simlive.log" || true
      - name: Protokoll aufbewahren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-sim-live
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  # ---------------------------------------------------------------- Export (nur integration / main / von Hand)
  export:
    name: Export · ${{ matrix.preset }}
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.export != 'false') ||
      contains(github.event.head_commit.message, '[export]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            datei: MoveEyeSim3D.x86_64
          - preset: Windows Desktop
            datei: MoveEyeSim3D.exe
          - preset: Linux Pi                 # Sim 3.57.0: Raspberry Pi 5 (arm64), «Simulator intern» (MoveEye Teil 639zx)
            datei: MoveEyeSim3D.arm64
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Export-Vorlagen 4.3 (Cache, nur Linux + Windows + Linux arm64)
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-templates-4.3-stable-linux-windows-arm64
      - name: Export-Vorlagen herunterladen
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          d=~/.local/share/godot/export_templates/4.3.stable; mkdir -p "$d" "$RUNNER_TEMP/t" && cd "$RUNNER_TEMP/t"
          curl -fsSL -o t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q t.tpz templates/version.txt templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.arm64 templates/linux_debug.arm64
          mv templates/* "$d"/ && rm -rf "$RUNNER_TEMP/t" && ls -la "$d"
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
      - name: Exportieren (ohne Signatur)
        env:
          PRESET: ${{ matrix.preset }}
          DATEI: ${{ matrix.datei }}
        run: |
          out="$RUNNER_TEMP/build"; mkdir -p "$out"
          timeout 1500 "$GODOT_BIN" --headless --path simulator3d --export-release "$PRESET" "$out/$DATEI" 2>&1 | tail -30
          test -s "$out/$DATEI" || { echo "::error::Export $PRESET fehlgeschlagen"; exit 1; }
          cp "simulator3d/Lies mich.txt" "$out/" 2>/dev/null || true
          ls -la "$out"; sha256sum "$out/$DATEI"
          ver=$(python3 -c 'import json; print(json.load(open("simulator3d/version.json")).get("ver","?"))')
          echo "VER=$ver" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: MoveEyeSim3D-${{ env.VER }}-${{ matrix.preset == 'Linux' && 'linux' || matrix.preset == 'Linux Pi' && 'pi' || 'windows' }}-${{ github.sha }}
          path: ${{ runner.temp }}/build/
          retention-days: 14

  # ---------------------------------------------------------------- Ergebnis: der eine Haken, auf den ein Release wartet
  ergebnis:
    name: Ergebnis · alles Nötige grün, nichts still übersprungen
    needs: [auswahl, moveeye, web, sim-texte, usb-installer, hp-update, pi-dienst, sim-liste, sim, sim-live, export]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read                     # times of the jobs of this run
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge
      - name: Ergebnis (rot, wenn ein Job rot ist oder fehlt – auf main auch, wenn etwas übersprungen wurde)
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          CI_EXPORT: ${{ github.event.inputs.export }}
          CI_NACHRICHT: ${{ github.event.head_commit.message }}
        run: python3 werkzeuge/ci_auswahl.py --ergebnis
