# CI: die schweren Prüfungen auf GitHub statt auf dem lokalen Rechner (Nov. 2026). Lokal abfragen / warten:
#   werkzeuge/ci_status.sh [zweig|commit] [--warten] [--fehler]
#  - Push auf real-*: schnelle Tests (MoveEye + Simulator), ohne Export
#  - Push auf integration / main: alles, dazu Export Linux + Windows (ohne Signatur) als Artefakt
#  - von Hand (Actions -> CI -> Run workflow): alles, Export abwählbar; «[export]» in der Commit-Nachricht: Export auch auf real-*
# Keine Geheimnisse: der Signierschlüssel kommt nie hierher (Signieren bleibt lokal), keine ntfy-Themen.
name: CI
on:
  push:
    branches: ["real-*", integration, main]
  workflow_dispatch:
    inputs:
      export:
        description: "Simulator exportieren (Linux + Windows, ohne Signatur)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/real-') }}
env:
  GODOT_VER: "4.3"
  GODOT_BIN: /home/runner/godot/Godot_v4.3-stable_linux.x86_64
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------- MoveEye
  moveeye:
    name: MoveEye · bauen --pruefen + Selbsttest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pakete
        run: pip install -q opencv-python-headless numpy flask pillow cryptography
      - name: Quelle und Datei passen zusammen (bauen.py --pruefen)
        run: python3 werkzeuge/bauen.py --pruefen
      - name: Selbsttest (ohne Signaturen)
        env:
          MW_SELFTEST_NO_SIG: "1"          # signed only locally at the release
        run: |
          f=$(ls webcam_bewegung_*.py | sort -V | tail -1)
          echo "Teste $f"
          python3 -m py_compile "$f"
          python3 "$f" --self-test .

  moveeye-web:
    name: MoveEye · Web-Rauchtest + Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Pakete
        run: pip install -q opencv-python-headless numpy flask pillow cryptography playwright==1.55.0
      - name: Chromium (Cache)
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.55.0-chromium
      - name: Chromium installieren
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then python3 -m playwright install-deps chromium
          else python3 -m playwright install --with-deps chromium; fi
      - name: Web-Rauchtest (alle Adressen ohne / mit Anmeldung, jede Seite im Browser)
        timeout-minutes: 15
        run: python3 werkzeuge/web_rauchtest.py --browser

  # ---------------------------------------------------------------- Simulator
  sim-texte:
    name: Simulator · sim_texte.py --pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            simulator3d
            werkzeuge
      - run: python3 werkzeuge/sim_texte.py --pruefen

  sim-liste:
    name: Simulator · Testliste
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.l.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge
      - id: l
        run: |
          t=$(cd werkzeuge && ls *_test.gd | sed 's/\.gd$//' | python3 -c 'import json,sys; print(json.dumps(["parse"]+sys.stdin.read().split()))')
          echo "tests=$t" >> "$GITHUB_OUTPUT"; echo "$t"

  sim:
    name: Simulator · ${{ matrix.test }}
    needs: sim-liste
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.sim-liste.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: |
          export HOME="/tmp/ci_home_import"; mkdir -p "$HOME"
          timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/import.log"
      - name: Test ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
        run: |
          export HOME="/tmp/ci_home_$TEST"; mkdir -p "$HOME"       # own test HOME under /tmp (hospiz_test insists), never a real one
          log="$RUNNER_TEMP/$TEST.log"
          cd simulator3d
          if [ "$TEST" = "parse" ]; then
            # main scene without picture: every script must load, schnittstelle.gd writes «Schnittstelle: OK …» after 2 s
            ( timeout 180 "$GODOT_BIN" --headless --path . -- --no-update --no-tour --port 9447 > "$log" 2>&1 ) &
            pid=$!
            for i in $(seq 1 170); do
              grep -qE "Schnittstelle: OK|SCRIPT ERROR" "$log" 2>/dev/null && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            pkill -f "Godot_v4.3-stable_linux.x86_64 --headless --path . --" || true
            wait $pid || true
            grep -E "Schnittstelle|SCRIPT ERROR|Parse Error|Failed to load script" "$log" | head -40
            if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" "$log"; then echo "::error::Skript-Fehler (siehe oben)"; exit 1; fi
            grep -q "Schnittstelle: OK" "$log" || { tail -60 "$log"; echo "::error::kein «Schnittstelle: OK»"; exit 1; }
            echo "Parse-Check OK"
          else
            set +e
            timeout 900 "$GODOT_BIN" --headless --path . -s "$PWD/../werkzeuge/$TEST.gd" -- --no-update --no-tour > "$log" 2>&1
            rc=$?
            set -e
            tail -40 "$log"
            [ $rc -eq 0 ] || { echo "::error::$TEST: Exit-Code $rc"; exit 1; }
            if grep -q "SCRIPT ERROR" "$log"; then echo "::error::$TEST: SCRIPT ERROR"; exit 1; fi
          fi
      - name: Protokoll aufbewahren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.test }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  # ---------------------------------------------------------------- Export (nur integration / main / von Hand)
  export:
    name: Export · ${{ matrix.preset }}
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.export != 'false') ||
      contains(github.event.head_commit.message, '[export]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            datei: MoveEyeSim3D.x86_64
          - preset: Windows Desktop
            datei: MoveEyeSim3D.exe
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Export-Vorlagen 4.3 (Cache, nur Linux + Windows)
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-templates-4.3-stable-linux-windows
      - name: Export-Vorlagen herunterladen
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          d=~/.local/share/godot/export_templates/4.3.stable; mkdir -p "$d" "$RUNNER_TEMP/t" && cd "$RUNNER_TEMP/t"
          curl -fsSL -o t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q t.tpz templates/version.txt templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe
          mv templates/* "$d"/ && rm -rf "$RUNNER_TEMP/t" && ls -la "$d"
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
      - name: Exportieren (ohne Signatur)
        env:
          PRESET: ${{ matrix.preset }}
          DATEI: ${{ matrix.datei }}
        run: |
          out="$RUNNER_TEMP/build"; mkdir -p "$out"
          timeout 1500 "$GODOT_BIN" --headless --path simulator3d --export-release "$PRESET" "$out/$DATEI" 2>&1 | tail -30
          test -s "$out/$DATEI" || { echo "::error::Export $PRESET fehlgeschlagen"; exit 1; }
          cp "simulator3d/Lies mich.txt" "$out/" 2>/dev/null || true
          ls -la "$out"; sha256sum "$out/$DATEI"
          ver=$(python3 -c 'import json; print(json.load(open("simulator3d/version.json")).get("ver","?"))')
          echo "VER=$ver" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: MoveEyeSim3D-${{ env.VER }}-${{ matrix.preset == 'Linux' && 'linux' || 'windows' }}-${{ github.sha }}
          path: ${{ runner.temp }}/build/
          retention-days: 14
