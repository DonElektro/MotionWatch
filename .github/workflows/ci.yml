# CI: die schweren Prüfungen auf GitHub statt auf dem lokalen Rechner (Nov. 2026). Lokal abfragen / warten:
#   werkzeuge/ci_status.sh [zweig|commit] [--warten] [--fehler]
#  - Push auf real-*: schnelle Tests (MoveEye + Simulator), ohne Export
#  - Push auf integration / main: alles, dazu Export Linux + Windows (ohne Signatur) als Artefakt
#  - von Hand (Actions -> CI -> Run workflow): alles, Export abwählbar; «[export]» in der Commit-Nachricht: Export auch auf real-*
# Keine Geheimnisse: der Signierschlüssel kommt nie hierher (Signieren bleibt lokal), keine ntfy-Themen.
name: CI
on:
  push:
    branches: ["real-*", integration, main]
  workflow_dispatch:
    inputs:
      export:
        description: "Simulator exportieren (Linux + Windows, ohne Signatur)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/real-') }}
env:
  GODOT_VER: "4.3"
  GODOT_BIN: /home/runner/godot/Godot_v4.3-stable_linux.x86_64
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------- MoveEye
  moveeye:
    name: MoveEye · bauen --pruefen + Selbsttest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pakete
        run: pip install -q opencv-python-headless numpy flask pillow cryptography
      - name: Quelle und Datei passen zusammen (bauen.py --pruefen)
        run: python3 werkzeuge/bauen.py --pruefen
      - name: Bau-Infos passen zum Projektstand (bau_pruefen.py, nur Warnung – nichts wird nachgezogen)
        run: python3 werkzeuge/bau_pruefen.py --ci
      - name: Selbsttest (ohne Signaturen)
        env:
          MW_SELFTEST_NO_SIG: "1"          # signed only locally at the release
        run: |
          f=$(ls webcam_bewegung_*.py | sort -V | tail -1)
          echo "Teste $f"
          python3 -m py_compile "$f"
          python3 "$f" --self-test .
      - name: Zusatzdatei – gültig / verändert / fehlt, Signatur (Test-Schlüssel), Kern ohne ZIP, Grösse
        run: |
          f=$(ls webcam_bewegung_*.py | sort -V | tail -1)
          python3 werkzeuge/zusatzdaten_test.py --datei "$f"
      - name: Drei Spuren – Simulator nur im signierten versions.json (Test-Schlüssel), Versionsprüfung je Spur
        run: |
          f=$(ls webcam_bewegung_*.py | sort -V | tail -1)
          python3 werkzeuge/sim_manifest_test.py --datei "$f"
          python3 werkzeuge/versionen.py --test > /dev/null
          python3 werkzeuge/versionen_spuren_test.py

  moveeye-web:
    name: MoveEye · Web-Rauchtest + Browser (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Pakete
        run: pip install -q opencv-python-headless numpy flask pillow cryptography playwright==1.55.0 onnxruntime==1.20.1   # onnxruntime: piper_test.py (= PIPER_ORT, Teil 639zzb)
      - name: Chromium (Cache)
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.55.0-chromium
      - name: Chromium installieren
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then python3 -m playwright install-deps chromium
          else python3 -m playwright install --with-deps chromium; fi
      - name: Web-Rauchtest (alle Adressen ohne / mit Anmeldung, jede Seite im Browser)
        timeout-minutes: 15
        run: python3 werkzeuge/web_rauchtest.py --browser
      - name: Kamerabilder im Browser (Verbindungen, Selbstheilung, Neu laden bleibt im Reiter)
        timeout-minutes: 8
        run: python3 werkzeuge/bildstrom_test.py
      - name: Drei Kamera-Ansichten (Kopf / Wärmebild / Weitwinkel, Übersichtsbild, pro Gerät gemerkt)
        timeout-minutes: 8
        run: python3 werkzeuge/ansichten_test.py
      - name: Datentausch (Dateien, Texte mit Versionen, Chats, Rechte, Gäste, Grenzen, Hochladen in Stücken, Browser)
        timeout-minutes: 8
        run: python3 werkzeuge/tausch_test.py --browser
      - name: «🌿 Bestimmen» im Datentausch (Ersatz-Modell, Rechte, Gäste, Laden mit Prüfsumme, Zwischenspeicher, besetzt, Browser)
        timeout-minutes: 6
        run: python3 werkzeuge/bioclip_test.py --browser
      - name: Spielesammlung (Paket GS-1.4, GAMES_PKG, jedes neue Spiel am Handy und PC ohne Internet)
        timeout-minutes: 25
        run: python3 werkzeuge/spiele_test.py
      - name: Spiele-Kacheln über https (Bilder vom gleichen Ursprung, keine http://-Bilder, Browser)
        timeout-minutes: 5
        run: python3 werkzeuge/spiele_test.py --kacheln-https
      - name: Fertige Spiele zum Nachladen (nur der Admin lädt, Prüfsumme, Platz, Entpacken, Kachel, Spiele-Port, Entfernen - mit Ersatz-Paketen)
        timeout-minutes: 4
        run: python3 werkzeuge/fertigspiele_test.py
      - name: Schach zu zweit mit je einem Handy (Vermittlung auf dem Pi - Regeln, Code, Sitz-Schlüssel, Grenzen, Gäste, Browser mit zwei Handys)
        timeout-minutes: 8
        run: python3 werkzeuge/schach_fern_test.py
      - name: Spiele unter «Mehr» - ein Einstieg «Spielen», Kachel «Spielecke», Freigeben von der Spielecke aus
        timeout-minutes: 5
        run: python3 werkzeuge/spiele_ordnen_test.py
      - name: «🔍 Untersuchen» im Live-Bild (Ausschnitt, Kopf, Weitwinkel, Wärmebild, Hochladen, Rechte, Gäste, Funde, Zeitlimit, Browser)
        timeout-minutes: 6
        run: python3 werkzeuge/untersuchen_test.py --browser
      - name: Rechte und Schutz (Kind / Familie / ohne Rechte, PIN für alles im Browser, Stufe → Sirene, Zeitplan nach hartem Neustart)
        timeout-minutes: 8
        run: python3 werkzeuge/rechte_schutz_test.py --browser
      - name: Karte «Sicherheit» wieder da (Administrator sieht sie, andere Benutzer nicht)
        timeout-minutes: 5
        run: python3 werkzeuge/sicherheit_karte_test.py
      - name: Kopf-Chip «N Hinweise» statt «alles ok», wenn etwas gemeldet wird
        timeout-minutes: 4
        run: python3 werkzeuge/kopf_chip_test.py
      - name: Werkseinstellungen - Liste der Kopien mit Datum
        timeout-minutes: 4
        run: python3 werkzeuge/werkskopie_test.py
      - name: Deutsche Lücken (keine englischen Texte im deutschen Web, /messages übersetzt)
        timeout-minutes: 8
        run: python3 werkzeuge/deutsch_luecken_test.py
      - name: Ruhiges Protokoll (kein Hin und Her bei walk_frames und Wind)
        timeout-minutes: 5
        run: python3 werkzeuge/protokoll_ruhe_test.py
      - name: Simulator intern (gefälschtes Pi-Paket - holen, prüfen, auspacken, starten, beenden, zurück)
        timeout-minutes: 4
        run: python3 werkzeuge/sim_intern_test.py
      - name: Piper-Stimme (Tabelle, Ersatz alte Stimme, Laden mit Prüfsumme, Browser «Ton im Browser», Simulator /speech)
        timeout-minutes: 6
        run: python3 werkzeuge/piper_test.py --browser
      - name: Werkstatt offline (eine HTML-Datei, file://, Netz gesperrt, keine JS-Fehler, Modell, Reiter)
        timeout-minutes: 6
        run: python3 werkzeuge/werkstatt_html.py --aus /tmp/werkstatt --test --bilder /tmp/werkstatt && ls -la /tmp/werkstatt
      - name: Selbstbau-Paket (bausatz.py, nur Deutsch, ohne Signaturprüfung)
        timeout-minutes: 5
        run: python3 werkzeuge/bausatz.py --sprachen de --unsigniert --aus /tmp/bausatz && ls -la /tmp/bausatz

  # ---------------------------------------------------------------- Simulator
  sim-texte:
    name: Simulator · sim_texte.py --pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            simulator3d
            werkzeuge
      - run: python3 werkzeuge/sim_texte.py --pruefen

  # ---------------------------------------------------------------- USB-Installer (Simulator-PC neu aufsetzen)
  usb-installer:
    name: USB-Installer · ${{ matrix.pruefung }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pruefung: ["statisch", "pakete ubuntu:24.04", "pakete ubuntu:26.04", "retten ubuntu:24.04", "retten ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge/usb_installer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pakete
        run: pip install -q pyyaml jsonschema
      - name: pruefen.sh ${{ matrix.pruefung }}
        env:
          P: ${{ matrix.pruefung }}
        run: bash werkzeuge/usb_installer/pruefen.sh $P

  # ---------------------------------------------------------------- Simulator-PC (HP): signiertes Update, Haken, Testbild
  hp-update:
    name: HP-Update · Prüfkette + Einspielen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x hp werkzeuge/test_runner/*.sh werkzeuge/linux_paket.sh
          shellcheck -x simulator3d/beilagen_linux/kiosk_sitzung.sh simulator3d/beilagen_linux/kiosk_ein.sh simulator3d/beilagen_linux/kiosk_aus.sh simulator3d/beilagen_linux/controller_koppeln.sh
      - name: Testbild (Python)
        run: python3 -m py_compile simulator3d/beilagen_linux/testbild.py simulator3d/beilagen_linux/hp_wache.py simulator3d/beilagen_linux/controller_fenster.py werkzeuge/erkennungstest/fortschritt.py werkzeuge/erkennungstest/erkennungstest.py werkzeuge/test_runner/dauer.py
      - name: dauer_test.sh (Dauerrechnen - Spielen hält an, sichert, rechnet weiter)
        run: bash werkzeuge/test_runner/dauer_test.sh
      - name: controller_test.sh (PS5-Controller koppeln mit Ersatz-bluetoothctl)
        run: bash werkzeuge/test_runner/controller_test.sh
      - name: hp_update_test.sh (echte Signaturen, Verfälschungen, Einspielen mit Test-Schlüssel)
        run: sudo bash werkzeuge/test_runner/hp_update_test.sh

  sim-liste:
    name: Simulator · Testliste
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.l.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: werkzeuge
      - id: l
        run: |
          t=$(cd werkzeuge && ls *_test.gd | sed 's/\.gd$//' | python3 -c 'import json,sys; print(json.dumps(["parse"]+sys.stdin.read().split()))')
          echo "tests=$t" >> "$GITHUB_OUTPUT"; echo "$t"

  sim:
    name: Simulator · ${{ matrix.test }}
    needs: sim-liste
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.sim-liste.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: |
          export HOME="/tmp/ci_home_import"; mkdir -p "$HOME"
          timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -5 "$RUNNER_TEMP/import.log"
      - name: Test ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
        run: |
          export HOME="/tmp/ci_home_$TEST"; mkdir -p "$HOME"       # own test HOME under /tmp (hospiz_test insists), never a real one
          log="$RUNNER_TEMP/$TEST.log"
          cd simulator3d
          if [ "$TEST" = "parse" ]; then
            # main scene without picture: every script must load, schnittstelle.gd writes «Schnittstelle: OK …» after 2 s
            ( timeout 180 "$GODOT_BIN" --headless --path . -- --no-update --no-tour --port 9447 > "$log" 2>&1 ) &
            pid=$!
            for i in $(seq 1 170); do
              grep -qE "Schnittstelle: OK|SCRIPT ERROR" "$log" 2>/dev/null && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            pkill -f "Godot_v4.3-stable_linux.x86_64 --headless --path . --" || true
            wait $pid || true
            grep -E "Schnittstelle|SCRIPT ERROR|Parse Error|Failed to load script" "$log" | head -40
            if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" "$log"; then echo "::error::Skript-Fehler (siehe oben)"; exit 1; fi
            grep -q "Schnittstelle: OK" "$log" || { tail -60 "$log"; echo "::error::kein «Schnittstelle: OK»"; exit 1; }
            echo "Parse-Check OK"
          else
            # up to 3 attempts (Godot tests are sometimes flaky on the runner, e.g. gelenke_test at 3.29.0); green = exit 0 and no SCRIPT ERROR
            ok=0
            for try in 1 2 3; do
              rm -rf "$HOME"; mkdir -p "$HOME"
              set +e
              timeout 900 "$GODOT_BIN" --headless --path . -s "$PWD/../werkzeuge/$TEST.gd" -- --no-update --no-tour > "$log" 2>&1
              rc=$?
              set -e
              if [ $rc -eq 0 ] && ! grep -q "SCRIPT ERROR" "$log"; then ok=1; break; fi
              echo "::warning::$TEST: Versuch $try fehlgeschlagen (Exit-Code $rc)"
              tail -40 "$log"
            done
            tail -40 "$log"
            [ $ok -eq 1 ] || { echo "::error::$TEST: 3 Versuche fehlgeschlagen (Exit-Code $rc)"; exit 1; }
            [ $try -eq 1 ] || echo "::warning::$TEST: erst im Versuch $try grün"
          fi
      - name: Protokoll aufbewahren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.test }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7

  # ---------------------------------------------------------------- Export (nur integration / main / von Hand)
  export:
    name: Export · ${{ matrix.preset }}
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.export != 'false') ||
      contains(github.event.head_commit.message, '[export]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            datei: MoveEyeSim3D.x86_64
          - preset: Windows Desktop
            datei: MoveEyeSim3D.exe
          - preset: Linux Pi                 # Sim 3.57.0: Raspberry Pi 5 (arm64), «Simulator intern» (MoveEye Teil 639zx)
            datei: MoveEyeSim3D.arm64
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Export-Vorlagen 4.3 (Cache, nur Linux + Windows + Linux arm64)
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-templates-4.3-stable-linux-windows-arm64
      - name: Export-Vorlagen herunterladen
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          d=~/.local/share/godot/export_templates/4.3.stable; mkdir -p "$d" "$RUNNER_TEMP/t" && cd "$RUNNER_TEMP/t"
          curl -fsSL -o t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q t.tpz templates/version.txt templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.arm64 templates/linux_debug.arm64
          mv templates/* "$d"/ && rm -rf "$RUNNER_TEMP/t" && ls -la "$d"
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
      - name: Exportieren (ohne Signatur)
        env:
          PRESET: ${{ matrix.preset }}
          DATEI: ${{ matrix.datei }}
        run: |
          out="$RUNNER_TEMP/build"; mkdir -p "$out"
          timeout 1500 "$GODOT_BIN" --headless --path simulator3d --export-release "$PRESET" "$out/$DATEI" 2>&1 | tail -30
          test -s "$out/$DATEI" || { echo "::error::Export $PRESET fehlgeschlagen"; exit 1; }
          cp "simulator3d/Lies mich.txt" "$out/" 2>/dev/null || true
          ls -la "$out"; sha256sum "$out/$DATEI"
          ver=$(python3 -c 'import json; print(json.load(open("simulator3d/version.json")).get("ver","?"))')
          echo "VER=$ver" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: MoveEyeSim3D-${{ env.VER }}-${{ matrix.preset == 'Linux' && 'linux' || matrix.preset == 'Linux Pi' && 'pi' || 'windows' }}-${{ github.sha }}
          path: ${{ runner.temp }}/build/
          retention-days: 14
