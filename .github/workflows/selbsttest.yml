# Checks every new version automatically: compiles, runs the built-in self-test
# (update signatures in versions.json, QR codes, web push encryption, settings, JavaScript of all pages),
# no function defined twice (bauen.py --pruefen) and the web smoke test (every address without / with login).
name: Selbsttest
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  selbsttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pakete
        run: pip install opencv-python-headless numpy flask pillow cryptography
      - name: Quelle und Datei passen zusammen
        run: python3 werkzeuge/bauen.py --pruefen
      - name: Neuste Version testen
        env:
          # 2.98.50 (Daniel): work branches (integration, wt-*) are signed only at the release - check the signature only on main
          MW_SELFTEST_NO_SIG: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
        run: |
          f=$(ls webcam_bewegung_*.py | sort -V | tail -1)
          echo "Teste $f"
          python3 -m py_compile "$f"
          python3 "$f" --self-test .
      - name: Web-Rauchtest (alle Adressen ohne / mit Anmeldung)
        run: python3 werkzeuge/web_rauchtest.py
