# Bergtal-Karte (MoveEye, Teil 639zzzzzt): baut das Kartenpaket «Bergtal» aus den Daten des Simulators - werkzeuge/bergkarte/
# export.gd (Godot 4.3 ohne Bild: Höhenkarte, Bodenart, Orte, Wege, Bäche, Seen, geheime Orte), dann werkzeuge/bergkarte/
# paket.py (Höhen-Kacheln terrarium, Höhenlinien, Landschaft, GeoJSON, Stil, MapLibre + Schriften aus karte-web-2.zip mit der
# Prüfsumme aus quelle/639zzq) -, prüft es (paket.py --pruefen und werkzeuge/bergkarte_test.gd: Paket = Simulator) und legt
# es auf Wunsch als Release an. Asset bergtal-karte-N.zip an «bergkarte-N» (nie «latest»), Probe an «bergkarteprobe-<Lauf>».
# Von selbst nach jedem erfolgreichen Lauf von «Sim-Pakete» (Sim-Release): nur bauen + prüfen + Pins als Artefakt, KEIN
# Release (das Paket folgt dem Bergtal des Simulators; ändert sich die Prüfsumme, braucht es ein neues bergkarte-N).
#   Nur bauen + prüfen:  gh api -X POST repos/DonElektro/MotionWatch/actions/workflows/bergkarte.yml/dispatches -f ref=main
#   Probe-Release:       … -f ref=main -f 'inputs[release]=probe'
#   Echt:                … -f ref=main -f 'inputs[release]=echt' -f 'inputs[tag]=bergkarte-2'
#   Probe wegräumen:     … -f ref=main -f 'inputs[loeschen]=bergkarteprobe-N'
# Danach (lokal, Integrator): `python3 werkzeuge/bergkarte/paket.py --eintragen pins_bergkarte.txt` schreibt BK_FILE in
# quelle/639zzzzzt, MoveEye bauen und signieren (die Prüfsumme kommt so in die signierte Hauptdatei). Ein Release wird nie
# überschrieben. Keine Geheimnisse: nur GITHUB_TOKEN.
name: Bergtal-Karte
on:
  workflow_dispatch:
    inputs:
      release:
        description: "keins · probe (Vorabversion bergkarteprobe-<Lauf>) · echt (Release <tag>, nur von main)"
        type: choice
        options: [keins, probe, echt]
        default: keins
      tag:
        description: "Tag für «echt» (bergkarte-N, = TAG in werkzeuge/bergkarte/paket.py und BK_TAG in quelle/639zzzzzt)"
        default: bergkarte-2
      loeschen:
        description: "Statt bauen: Probe-Release + Tag löschen (nur bergkarteprobe-N, nur Vorabversion)"
        default: ""
  workflow_run:
    workflows: ["Sim-Pakete"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: bergkarte
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  REL: ${{ inputs.release || 'keins' }}
  GODOT_BIN: /home/runner/godot/Godot_v4.3-stable_linux.x86_64

jobs:
  bauen:
    name: Bergtal-Karte · ${{ inputs.release || 'keins' }}
    if: >-
      github.repository == 'DonElektro/MotionWatch' &&
      ((github.event_name == 'workflow_dispatch' && inputs.loeschen == '') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Godot 4.3 (Cache)
        id: gcache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux
      - name: Godot 4.3 herunterladen
        if: steps.gcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && chmod +x Godot_v4.3-stable_linux.x86_64
      - name: Import (Cache simulator3d/.godot)
        uses: actions/cache@v4
        with:
          path: simulator3d/.godot
          key: godot-import-${{ hashFiles('simulator3d/**/*.png', 'simulator3d/**/*.glb', 'simulator3d/**/*.ogg', 'simulator3d/**/*.wav', 'simulator3d/**/*.mp3', 'simulator3d/**/*.jpg', 'simulator3d/**/*.gdshader', 'simulator3d/project.godot') }}
          restore-keys: godot-import-
      - name: Projekt importieren
        run: |
          export HOME="/tmp/bk_home_import"; mkdir -p "$HOME"
          timeout 900 "$GODOT_BIN" --headless --import --path simulator3d > "$RUNNER_TEMP/import.log" 2>&1 || true
          tail -3 "$RUNNER_TEMP/import.log"
      - name: Prüfen (Tag, Zweig, Release noch nicht da)
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'bergkarte-2' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          ptag=$(sed -n 's/^TAG = "\(bergkarte-[0-9]*\)"$/\1/p' werkzeuge/bergkarte/paket.py)
          qtag=$(sed -n 's/^BK_TAG = "\(bergkarte-[0-9]*\)"$/\1/p' quelle/639zzzzzt_bergtal_karte.py)
          [ -n "$ptag" ] && [ "$ptag" = "$qtag" ] || { echo "::error::TAG in paket.py ($ptag) und BK_TAG in quelle/639zzzzzt ($qtag) passen nicht"; exit 1; }
          if [ "$REL" = "echt" ]; then
            [ "$TAG" = "$ptag" ] || { echo "::error::Tag $TAG ist nicht $ptag (paket.py)"; exit 1; }
            msha=$(git ls-remote origin refs/heads/main | cut -f1)
            [ "$GITHUB_REF_NAME" = "main" ] && [ "$sha" = "$msha" ] || { echo "::error::echt nur vom aktuellen main ($msha), nicht $GITHUB_REF_NAME ($sha)"; exit 1; }
            tag="$TAG"
          else
            tag="bergkarteprobe-$GITHUB_RUN_NUMBER"
          fi
          if [ "$REL" != "keins" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag gibt es schon - nie überschreiben"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "BKZIP=bergtal-karte-${ptag#bergkarte-}.zip" >> "$GITHUB_ENV"
      - name: Web-Paket (MapLibre + Schriften) von karten-2, Prüfsumme aus quelle/639zzq
        run: |
          set -euo pipefail
          read -r name size sha < <(python3 -I werkzeuge/bergkarte/paket.py --web-pin)
          mkdir -p "$RUNNER_TEMP/web"
          curl -fsSL -o "$RUNNER_TEMP/web/$name" "https://github.com/$GITHUB_REPOSITORY/releases/download/karten-2/$name"
          echo "$sha  $RUNNER_TEMP/web/$name" | sha256sum -c -
          [ "$(stat -c %s "$RUNNER_TEMP/web/$name")" = "$size" ]
          echo "WEB=$RUNNER_TEMP/web/$name" >> "$GITHUB_ENV"
      - name: Stufe 1 – Daten aus dem Simulator (export.gd, ohne Bild)
        run: |
          set -euo pipefail
          export HOME="/tmp/bk_home_export"; mkdir -p "$HOME"
          cd simulator3d
          timeout 600 "$GODOT_BIN" --headless --path . -s "$PWD/../werkzeuge/bergkarte/export.gd" -- --aus "$RUNNER_TEMP/exp" | tee "$RUNNER_TEMP/export.txt"
          grep -q "Bergtal-Export OK" "$RUNNER_TEMP/export.txt" || { echo "::error::export.gd ohne «Bergtal-Export OK»"; exit 1; }
          ls -la "$RUNNER_TEMP/exp"
      - name: Stufe 2 – Paket bauen und prüfen (paket.py)
        run: |
          set -euo pipefail
          python3 -I werkzeuge/bergkarte/paket.py --export "$RUNNER_TEMP/exp" --web-zip "$WEB" --aus "$RUNNER_TEMP/out" --pins | tee "$RUNNER_TEMP/bau.txt"
          python3 -I werkzeuge/bergkarte/paket.py --pruefen "$RUNNER_TEMP/out" --export "$RUNNER_TEMP/exp" | tee -a "$RUNNER_TEMP/bau.txt"
          [ -s "$RUNNER_TEMP/out/$BKZIP" ] && [ -s "$RUNNER_TEMP/out/pins_bergkarte.txt" ] || { echo "::error::Paket oder Pins fehlen"; exit 1; }
          { grep -E '^(PAKET|PIN|PRUEFUNG)' "$RUNNER_TEMP/bau.txt" || true; } | cut -c1-900 | while read -r l; do echo "::notice title=Bergtal-Karte::$l"; done
      - name: Test Paket = Simulator (werkzeuge/bergkarte_test.gd)
        run: |
          set -euo pipefail
          export HOME="/tmp/bk_home_test"; mkdir -p "$HOME"
          cd simulator3d
          timeout 600 "$GODOT_BIN" --headless --path . -s "$PWD/../werkzeuge/bergkarte_test.gd" -- --no-update --no-tour > "$RUNNER_TEMP/test.txt" 2>&1 || true
          grep -aE "  ok |FEHLER|SCRIPT ERROR|Test OK" "$RUNNER_TEMP/test.txt" || true
          grep -q "Bergtal-Karte-Test OK" "$RUNNER_TEMP/test.txt" && ! grep -q "SCRIPT ERROR" "$RUNNER_TEMP/test.txt" || { echo "::error::bergkarte_test.gd rot"; exit 1; }
      - name: Messung als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bergkarte-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/out/pins_bergkarte.txt
            ${{ runner.temp }}/bau.txt
            ${{ runner.temp }}/export.txt
            ${{ runner.temp }}/test.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Zusammenfassung
        if: always()
        run: |
          set -euo pipefail
          { echo "### Bergtal-Karte"; echo '```'; for f in "$RUNNER_TEMP/bau.txt" "$RUNNER_TEMP/out/pins_bergkarte.txt" "$RUNNER_TEMP/test.txt"; do
              if [ -f "$f" ]; then grep -aE 'PAKET|PIN|PRUEFUNG|ok |FEHLER|Test OK|Bergtal:' "$f" | head -40 || true; else echo "(fehlt: $(basename "$f"))"; fi; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Release anlegen, Asset hochladen, zurücklesen
        if: env.REL == 'probe' || env.REL == 'echt'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"
          {
            if [ "$REL" = "probe" ]; then echo "PROBELAUF (Vorabversion) - nicht für Geräte, wird wieder gelöscht."; echo; fi
            echo "Bergtal-Karte für MoveEye (Teil 639zzzzzt): Relief, Höhenlinien, 3D, Orte, Wege, Touren des Bergtals im Simulator."
            echo "Erfundenes Tal, eigenes Gitter - keine echten Koordinaten. Gebaut mit https://github.com/$GITHUB_REPOSITORY/blob/$SHA/werkzeuge/bergkarte/paket.py"
            echo
            sed 's/^PIN /pin: /' "$O/pins_bergkarte.txt"
            echo "commit: $SHA"
            echo "lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md
          for i in 1 2 3; do
            if [ "$REL" = "probe" ]; then
              gh release create "$TAG" "$O/$BKZIP" "$O/pins_bergkarte.txt" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Probe · Bergtal-Karte" --notes-file notes.md --prerelease --latest=false && break
            else
              gh release create "$TAG" "$O/$BKZIP" "$O/pins_bergkarte.txt" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Bergtal-Karte" --notes-file notes.md --latest=false && break
            fi
            echo "Versuch $i fehlgeschlagen, warte"; sleep 30
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "::error::Release halb angelegt - bitte von Hand prüfen"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/zurueck"
          curl -fsSL -o "$RUNNER_TEMP/zurueck/$BKZIP" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$BKZIP"
          s=$(sed -n 's/^PIN bergkarte .*sha256=\([0-9a-f]*\).*/\1/p' "$O/pins_bergkarte.txt"); echo "$s  $RUNNER_TEMP/zurueck/$BKZIP" | sha256sum -c -
          echo "latest bleibt: $(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"

  weg:
    name: Probe löschen · ${{ inputs.loeschen }}
    if: github.repository == 'DonElektro/MotionWatch' && github.event_name == 'workflow_dispatch' && inputs.loeschen != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe-Release und Tag löschen (nur bergkarteprobe-N, nur Vorabversion, nie «latest»)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.loeschen }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^bergkarteprobe-[0-9]+$' || { echo "::error::nur bergkarteprobe-N, nicht $TAG"; exit 1; }
          pre=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)
          [ "$pre" = "true" ] || { echo "::error::$TAG ist keine Vorabversion - nicht gelöscht"; exit 1; }
          [ "$TAG" != "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" ] || { echo "::error::$TAG ist latest"; exit 1; }
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "gelöscht: $TAG" >> "$GITHUB_STEP_SUMMARY"
