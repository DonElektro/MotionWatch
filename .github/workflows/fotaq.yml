# FOTAQ (MoveEye Spielecke, Teil 639zzg): baut ScummVM (offizieller Emscripten-Port, dists/emscripten, nur die Queen-Engine,
# Vorbis für die deutsche, libmad für die englische Sprachausgabe) hier auf einem GitHub-Rechner, holt «Flight of the Amazon
# Queen» (CD-Fassung mit Sprache, Deutsch + Englisch) von den Freeware-Downloads von ScummVM, prüft die Daten (sha256 fest
# unten, Erkennungstabelle von ScummVM: «CD» in der richtigen Sprache), packt alles für den Spiele-Port (/g/fotaq/) und
# testet es im Browser (werkzeuge/spiele_test.py --fotaq). Assets an «fotaq-N» (nie «latest»), Probe an «fotaqprobe-<Lauf>».
#   Nur bauen + testen:  gh api -X POST repos/DonElektro/MotionWatch/actions/workflows/fotaq.yml/dispatches -f ref=<zweig>
#   Probe-Release:       … -f 'inputs[release]=probe'
#   Echt:                … -f ref=main -f 'inputs[release]=echt' -f 'inputs[tag]=fotaq-1'
#   Probe wegräumen:     … -f 'inputs[loeschen]=fotaqprobe-N'
#   Danach Grösse + sha256 (pins.txt / Release-Notiz) in FOTAQ_FILES (quelle/639zzg_fotaq.py) eintragen.
# GPL: ScummVM-Quellcode = Tag STV (Commit STV_COMMIT) + die Patches in werkzeuge/fotaq/ + dieser Ablauf, alles öffentlich.
# Keine Geheimnisse: nur GITHUB_TOKEN.
name: FOTAQ
on:
  workflow_dispatch:
    inputs:
      release:
        description: "keins · probe (Vorabversion fotaqprobe-<Lauf>) · echt (Release <tag>, nur von main)"
        type: choice
        options: [keins, probe, echt]
        default: keins
      tag:
        description: "Tag für «echt» (fotaq-N)"
        default: fotaq-1
      loeschen:
        description: "Statt bauen: Probe-Release + Tag löschen (nur fotaqprobe-N, nur Vorabversion)"
        default: ""
  # VORÜBERGEHEND (nur zum Testen auf dem Zweig, bis die Datei auf main ist; vor dem Zusammenführen entfernt):
  # «[fotaq-probe]» in der Commit-Nachricht = Probe-Release, «[fotaq-weg fotaqprobe-N]» = Probe löschen
  push:
    branches: [mw-fotaq]
    paths: [".github/workflows/fotaq.yml", "werkzeuge/fotaq/**", "werkzeuge/spiele_test.py"]
permissions:
  contents: write
concurrency:
  group: fotaq
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  REL: ${{ inputs.release || (contains(github.event.head_commit.message, '[fotaq-probe]') && 'probe' || 'keins') }}
  STV: v2026.4.0                                            # ScummVM, letzte stabile Fassung (10.10.2026), GPL v3+
  STV_COMMIT: 7d2709da5136866589f7602f5f5a7b17de03420e
  EMSDK_VERSION: 4.0.10                                     # = Standard in dists/emscripten/build.sh dieser Fassung
  DL: "https://downloads.scummvm.org/frs/extras/Flight%20of%20the%20Amazon%20Queen"
  DE_ZIP: FOTAQ_Ger_talkie-1.0.zip                          # CD, deutsche Sprache und Texte, Sprache/Effekte als Ogg Vorbis
  EN_ZIP: FOTAQ_Talkie-1.1.zip                              # CD, englisch, Sprache/Effekte als MP3
  DE_SHA256: 6e2826993a94864c1dd3d299369cb320a119cede4be14bf3f59b0471fa20768f   # gemessen im Lauf 42593712197 (09.11.2026)
  EN_SHA256: a25cdd5e003a0a5e402af99b218cc7ea81ad032cb36b8c05df3bd1167038d8a8

jobs:
  bauen:
    name: FOTAQ · ${{ inputs.release || 'push' }}
    if: github.repository == 'DonElektro/MotionWatch' && !inputs.loeschen && !contains(github.event.head_commit.message, '[fotaq-weg ')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen (Tag, Zweig, Release noch nicht da)
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'fotaq-1' }}
        run: |
          set -e
          sha=$(git rev-parse HEAD)
          if [ "$REL" = "echt" ]; then
            echo "$TAG" | grep -Eq '^fotaq-[0-9]{1,3}$' || { echo "::error::Tag $TAG ist nicht fotaq-N"; exit 1; }
            msha=$(git ls-remote origin refs/heads/main | cut -f1)
            [ "$GITHUB_REF_NAME" = "main" ] && [ "$sha" = "$msha" ] || { echo "::error::echt nur vom aktuellen main ($msha), nicht $GITHUB_REF_NAME ($sha)"; exit 1; }
            [ -n "$DE_SHA256" ] && [ -n "$EN_SHA256" ] || { echo "::error::echt nur mit festen DE_SHA256 / EN_SHA256"; exit 1; }
            tag="$TAG"
          else
            tag="fotaqprobe-$GITHUB_RUN_NUMBER"
          fi
          if [ "$REL" != "keins" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag gibt es schon - nie überschreiben"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Spieldaten holen und prüfen (sha256)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/dl" && cd "$RUNNER_TEMP/dl"
          for z in "$DE_ZIP" "$EN_ZIP"; do curl -fsSL --retry 3 -o "$z" "$DL/$z"; done
          ls -la
          d=$(sha256sum "$DE_ZIP" | cut -d' ' -f1); e=$(sha256sum "$EN_ZIP" | cut -d' ' -f1)
          echo "$DE_ZIP sha256 $d"; echo "$EN_ZIP sha256 $e"
          [ -z "$DE_SHA256" ] || [ "$d" = "$DE_SHA256" ] || { echo "::error::$DE_ZIP: sha256 $d statt $DE_SHA256"; exit 1; }
          [ -z "$EN_SHA256" ] || [ "$e" = "$EN_SHA256" ] || { echo "::error::$EN_ZIP: sha256 $e statt $EN_SHA256"; exit 1; }
          printf '%s %s %s\n%s %s %s\n' "$DE_ZIP" "$d" "$DL/$DE_ZIP" "$EN_ZIP" "$e" "$DL/$EN_ZIP" > "$RUNNER_TEMP/quellen.txt"
          for z in "$DE_ZIP" "$EN_ZIP"; do echo "== $z"; unzip -l "$z"; done
      - name: ScummVM ${{ env.STV }} holen und die Patches von MoveEye anwenden
        run: |
          set -e
          git clone -q --depth 1 --branch "$STV" https://github.com/scummvm/scummvm "$RUNNER_TEMP/scummvm"
          c=$(git -C "$RUNNER_TEMP/scummvm" rev-parse HEAD)
          [ "$c" = "$STV_COMMIT" ] || { echo "::error::$STV ist $c, nicht $STV_COMMIT"; exit 1; }
          for p in werkzeuge/fotaq/*.patch; do echo "== $p"; git -C "$RUNNER_TEMP/scummvm" apply --verbose "$GITHUB_WORKSPACE/$p"; done
          grep -q "EMSDK_VERSION:-$EMSDK_VERSION" "$RUNNER_TEMP/scummvm/dists/emscripten/build.sh" || { echo "::error::build.sh nutzt ein anderes emsdk"; exit 1; }
      - name: emsdk und Bibliotheken (Cache)
        id: ecache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/scummvm/dists/emscripten/emsdk-${{ env.EMSDK_VERSION }}
            ${{ runner.temp }}/scummvm/dists/emscripten/libs
          key: fotaq-emsdk-${{ env.EMSDK_VERSION }}-mad-${{ env.STV }}-1
      - name: Bauen (nur Queen-Engine, Vorbis + libmad)
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/scummvm"
          ./dists/emscripten/build.sh build --disable-all-engines --enable-engine=queen --enable-release \
            --enable-vorbis --enable-ogg --enable-mad --enable-zlib --enable-png --datadir=/data \
            --disable-detection-full --disable-cloud --disable-tts --disable-mt32emu --disable-lua --disable-tinygl --disable-bink \
            --disable-fluidsynth --disable-eventrecorder --disable-enet --disable-sdlnet --disable-libcurl --disable-discord \
            --disable-freetype2 --disable-jpeg --disable-gif 2>&1 | tee "$RUNNER_TEMP/bau.log" | grep -v '^\(emcc\|em++\|  C\|    C\)' | tail -120
          test -s build-emscripten/scummvm.wasm || { echo "::error::kein scummvm.wasm"; exit 1; }
          grep -E "^(Engines|Building|Using|Enabled)" "$RUNNER_TEMP/bau.log" | head -40 || true
          grep -E "Vorbis|MAD|libmad|Ogg|zlib|PNG" config.h config.mk 2>/dev/null | head -20 || true
          grep -q "define USE_VORBIS" config.h && grep -q "define USE_MAD" config.h || { echo "::error::Vorbis oder MAD fehlt im Bau"; exit 1; }
          ls -la build-emscripten build-emscripten/data
      - name: emsdk und Bibliotheken speichern (Cache, auch wenn ein späterer Schritt fehlschlägt)
        if: steps.ecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/scummvm/dists/emscripten/emsdk-${{ env.EMSDK_VERSION }}
            ${{ runner.temp }}/scummvm/dists/emscripten/libs
          key: fotaq-emsdk-${{ env.EMSDK_VERSION }}-mad-${{ env.STV }}-1
      - name: Lizenztexte der Bibliotheken sammeln
        run: |
          set -e
          L="$RUNNER_TEMP/libl"; mkdir -p "$L"
          E="$RUNNER_TEMP/scummvm/dists/emscripten/emsdk-$EMSDK_VERSION/upstream/emscripten"
          cp "$E/LICENSE" "$L/Emscripten_LICENSE.txt"
          for port in sdl3 vorbis ogg zlib libpng; do
            for f in $(find "$E/cache/ports" -maxdepth 3 -path "*$port*" \( -iname 'COPYING*' -o -iname 'LICENSE*' \) -type f 2>/dev/null | head -3); do
              cp "$f" "$L/${port}_$(basename "$f" .txt).txt"; done
          done
          cp "$RUNNER_TEMP/scummvm/dists/emscripten/libs/libmad-0.15.1b/COPYING" "$L/libmad_COPYING.txt"
          cp "$RUNNER_TEMP/scummvm/dists/emscripten/libs/libmad-0.15.1b/COPYRIGHT" "$L/libmad_COPYRIGHT.txt" 2>/dev/null || true
          ls -la "$L"
          for need in sdl3 vorbis ogg zlib libmad; do ls "$L" | grep -q "^$need" || { echo "::error::Lizenztext $need fehlt"; exit 1; }; done
      - name: Paket bauen (fotaq_paket.py)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -e
          python3 -I werkzeuge/fotaq/fotaq_paket.py --build "$RUNNER_TEMP/scummvm/build-emscripten" --src "$RUNNER_TEMP/scummvm" \
            --de "$RUNNER_TEMP/dl/$DE_ZIP" --en "$RUNNER_TEMP/dl/$EN_ZIP" --lizenzen "$RUNNER_TEMP/libl" --tag "$TAG" --stv "$STV" \
            --stv-commit "$STV_COMMIT" --commit "$SHA" --quellen "$(cat "$RUNNER_TEMP/quellen.txt")" --aus "$RUNNER_TEMP/out"
          ls -la "$RUNNER_TEMP/out"; cat "$RUNNER_TEMP/out/fotaq/LIZENZEN.txt"
      - name: Im Browser testen (spiele_test.py --fotaq, Handy / iPad / PC, DE und EN)
        run: |
          set -e
          pip install -q playwright==1.49.1 pillow
          python3 -m playwright install --with-deps chromium > /dev/null
          mkdir -p "$RUNNER_TEMP/bilder"
          python3 werkzeuge/spiele_test.py --nur-fotaq --fotaq "$RUNNER_TEMP/out/fotaq" --bilder "$RUNNER_TEMP/bilder"
      - name: Bilder und Protokoll als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotaq-test-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/bilder
            ${{ runner.temp }}/out/pins.txt
            ${{ runner.temp }}/out/fotaq/LIZENZEN.txt
            ${{ runner.temp }}/out/fotaq/fotaq.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### FOTAQ"
            echo '```'; cat "$RUNNER_TEMP/quellen.txt" 2>/dev/null; cat "$RUNNER_TEMP/out/pins.txt" 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release anlegen, Assets hochladen, zurücklesen
        if: env.REL == 'probe' || env.REL == 'echt'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -e
          O="$RUNNER_TEMP/out"; N="${TAG#*-}"
          cp "$O/fotaq/LIZENZEN.txt" "$O/LIZENZEN.txt"
          {
            if [ "$REL" = "probe" ]; then echo "PROBELAUF (Vorabversion) - nicht für Geräte, wird wieder gelöscht."; echo; fi
            echo "«Flight of the Amazon Queen» (CD-Fassung mit Sprachausgabe, Deutsch und Englisch) für die Spielecke von MoveEye (Teil 639zzg)."
            echo
            echo "Spiel: © 1995 John Passfield & Steven Stamatiadis, Freeware (Readme unverändert bei den Daten). Daten unverändert von:"
            sed 's/^/- /' "$RUNNER_TEMP/quellen.txt"
            echo
            echo "ScummVM $STV (© The ScummVM Team, GPL v3 oder später), nur die Queen-Engine, als WebAssembly."
            echo "Quellcode: https://github.com/scummvm/scummvm/tree/$STV (Commit $STV_COMMIT)"
            echo "Patches und Bau-Ablauf von MoveEye: https://github.com/$GITHUB_REPOSITORY/tree/$SHA/werkzeuge/fotaq · https://github.com/$GITHUB_REPOSITORY/blob/$SHA/.github/workflows/fotaq.yml"
            echo
            sed 's/^PIN /pin: /' "$O/pins.txt"
            echo "commit: $SHA"
            echo "lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md
          A="$O/fotaq-engine-$N.zip $O/fotaq-de-$N.zip $O/fotaq-en-$N.zip $O/pins.txt $O/LIZENZEN.txt"
          for i in 1 2 3; do
            if [ "$REL" = "probe" ]; then
              gh release create "$TAG" $A -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Probe · FOTAQ" --notes-file notes.md --prerelease --latest=false && break
            else
              gh release create "$TAG" $A -R "$GITHUB_REPOSITORY" --target "$SHA" --title "Flight of the Amazon Queen · Spielecke" --notes-file notes.md --latest=false && break
            fi
            echo "Versuch $i fehlgeschlagen, warte"; sleep 20
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "::error::Release halb angelegt - bitte von Hand prüfen"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/zurueck"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'fotaq-*.zip' -D "$RUNNER_TEMP/zurueck"
          for f in "$RUNNER_TEMP"/zurueck/*.zip; do
            s=$(grep "^PIN $(basename "$f") " "$O/pins.txt" | sed 's/.*sha256=\([0-9a-f]*\).*/\1/'); echo "$s  $f" | sha256sum -c -
          done
          echo "latest bleibt: $(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"

  weg:
    name: Probe löschen
    if: github.repository == 'DonElektro/MotionWatch' && (inputs.loeschen || contains(github.event.head_commit.message, '[fotaq-weg '))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe-Release und Tag löschen (nur fotaqprobe-N, nur Vorabversion, nie «latest»)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.loeschen }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          [ -n "$TAG" ] || TAG=$(printf '%s' "$MSG" | sed -n 's/.*\[fotaq-weg \(fotaqprobe-[0-9]*\)\].*/\1/p' | head -1)
          echo "$TAG" | grep -Eq '^fotaqprobe-[0-9]+$' || { echo "::error::nur fotaqprobe-N, nicht $TAG"; exit 1; }
          pre=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)
          [ "$pre" = "true" ] || { echo "::error::$TAG ist keine Vorabversion - nicht gelöscht"; exit 1; }
          [ "$TAG" != "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" ] || { echo "::error::$TAG ist latest"; exit 1; }
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "gelöscht: $TAG" >> "$GITHUB_STEP_SUMMARY"
